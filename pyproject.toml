[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leitblatt"
version = "0.1.0"
dependencies = [
    "odfpy"
]

[project.scripts]
leitblatt = "leitblatt.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"leitblatt" = ["data/*.ods"]
